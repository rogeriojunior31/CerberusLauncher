[package]
name = "cerberus-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cerberus-shared.workspace = true
serde.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Gamepad", "GamepadButton", "Navigator", "Window", "KeyboardEvent", "MediaQueryList", "Document", "Element", "DomRect", "HtmlCanvasElement", "HtmlImageElement", "CanvasRenderingContext2d", "PointerEvent", "WheelEvent", "AudioContext", "BaseAudioContext", "OscillatorNode", "OscillatorType", "GainNode", "AudioParam", "AudioNode", "AudioDestinationNode", "AudioScheduledSourceNode", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "Storage"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"
